<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=http://localhost:3000/">
  <title>Opening CAPACITY CONNECT Portal...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #081426;
      color: #ffffff;
      text-align: center;
    }
    .card {
      background: #0b1e36;
      padding: 2.5rem;
      border-radius: 1.5rem;
      border: 1px solid #1e40af;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      max-width: 480px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    a.btn {
      display: inline-block;
      background: #0284c7;
      color: white;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    a.btn:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>CAPACITY CONNECT</h1>
    <p>MoES / IMD Digital Capacity Building & LMS Portal</p>
    <p>Redirecting you to the portal at <code>http://localhost:3000</code>...</p>
    <a href="http://localhost:3000/" class="btn">Click Here to Open Portal</a>
  </div>
</body>
</html>
