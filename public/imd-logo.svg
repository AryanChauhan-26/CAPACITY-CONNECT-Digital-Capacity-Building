  <line x1="60" y1="102" x2="60" y2="108" stroke="#38bdf8" stroke-width="2" />
  <line x1="12" y1="60" x2="18" y2="60" stroke="#38bdf8" stroke-width="2" />
  <line x1="102" y1="60" x2="108" y2="60" stroke="#38bdf8" stroke-width="2" />
