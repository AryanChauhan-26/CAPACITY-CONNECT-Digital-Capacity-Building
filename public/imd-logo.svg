  <circle cx="60" cy="60" r="26" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
  <circle cx="60" cy="60" r="14" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.8"/>
  
  <!-- Cyclone / Wave Motif -->
  <path d="M60 20 C75 20, 95 35, 95 60 C95 80, 80 95, 60 95 C45 95, 25 80, 25 60 C25 45, 40 32, 55 35 C68 38, 75 48, 72 60 C70 70, 60 74, 52 70" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  
  <!-- Satellite & Radio pulses -->
  <circle cx="60" cy="60" r="5" fill="#f8fafc" />
  <circle cx="60" cy="60" r="2" fill="#0284c7" />
  
  <!-- Cardinal ticks -->
