  </defs>
  <!-- Outer Ring with Tech Nodes -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="url(#imdGrad)" stroke-width="4" stroke-dasharray="8 4"/>
  <circle cx="60" cy="60" r="50" fill="#0b1e36" stroke="#38bdf8" stroke-width="1.5" />
  
