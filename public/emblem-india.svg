<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 135" width="100" height="135">
  <!-- State Emblem of India Silhouette Stylized for Official Portals -->
  <g fill="#1e3a8a">
    <!-- Top Lions Crest -->
    <path d="M50 8 C42 8, 38 14, 38 20 C35 22, 32 26, 32 32 C32 38, 35 44, 40 47 C39 49, 39 52, 41 55 C43 58, 47 60, 50 60 C53 60, 57 58, 59 55 C61 52, 61 49, 60 47 C65 44, 68 38, 68 32 C68 26, 65 22, 62 20 C62 14, 58 8, 50 8 Z" fill="#1e293b"/>
    <!-- Mane details -->
    <path d="M46 16 C48 14, 52 14, 54 16 C57 19, 57 24, 54 28 C52 30, 48 30, 46 28 C43 24, 43 19, 46 16 Z" fill="#ffffff" opacity="0.6"/>
    <circle cx="50" cy="22" r="3" fill="#1e293b"/>
    <!-- Left Lion Profile -->
    <path d="M26 30 C20 30, 16 35, 16 42 C16 48, 20 54, 25 56 C28 58, 32 58, 35 56 C38 52, 38 46, 36 40 C34 34, 30 30, 26 30 Z" fill="#1e293b"/>
    <!-- Right Lion Profile -->
    <path d="M74 30 C80 30, 84 35, 84 42 C84 48, 80 54, 75 56 C72 58, 68 58, 65 56 C62 52, 62 46, 64 40 C66 34, 70 30, 74 30 Z" fill="#1e293b"/>
    <!-- Abacus Platform -->
    <rect x="14" y="65" width="72" height="12" rx="2" fill="#1e293b"/>
    <!-- Center Ashoka Chakra on Abacus -->
    <circle cx="50" cy="71" r="5" fill="#ffffff"/>
    <circle cx="50" cy="71" r="4.5" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    <circle cx="50" cy="71" r="1.5" fill="#1e293b"/>
    <!-- Horse on left, Bull on right -->
    <ellipse cx="28" cy="71" rx="4" ry="2.5" fill="#ffffff" opacity="0.7"/>
    <ellipse cx="72" cy="71" rx="4" ry="2.5" fill="#ffffff" opacity="0.7"/>
    <!-- Lotus Base -->
    <path d="M20 78 C25 88, 35 92, 50 92 C65 92, 75 88, 80 78 Z" fill="#1e293b"/>
    <rect x="24" y="93" width="52" height="3" rx="1" fill="#1e293b"/>
  </g>
  <!-- Satyameva Jayate in Devanagari -->
  <text x="50" y="112" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#1e293b" letter-spacing="1.5">सत्यमेव जयते</text>
  <text x="50" y="126" font-family="'Inter', sans-serif" font-size="7" font-weight="600" text-anchor="middle" fill="#64748b" letter-spacing="1">GOVT. OF INDIA</text>
</svg>
